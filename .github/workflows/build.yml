name: build
on:
  push:
    branches: [main, master, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windows-x86_64, runner: windows-2025}
          - {platform: linux-x86_64, runner: ubuntu-22.04}
          - {platform: linux-aarch64, runner: ubuntu-24.04-arm}
          - {platform: macos-arm64, runner: macos-15, arch: arm64}
          - {platform: macos-x86_64, runner: macos-15, arch: x86_64, skip_tests: true}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Ninja
        run: python -m pip install ninja
      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -Append $env:GITHUB_ENV }
          }
      - name: Download pinned OpenRAC SDK
        run: python tools/fetch_sdk.py
      - name: Configure
        run: |
          ARCH=""
          if [ -n "${{ matrix.arch }}" ]; then
            ARCH="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release $ARCH
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        if: ${{ !matrix.skip_tests }}
        run: ctest --test-dir build --output-on-failure
      - name: Package platform archive
        run: |
          SDK=$(python tools/fetch_sdk.py)
          python "$SDK/tools/package_mod.py" build/package/bolt_multiplier -o dist
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mod-*
          path: dist
          merge-multiple: true
      - name: Combine platform packages
        run: |
          SDK=$(python tools/fetch_sdk.py)
          VERSION=$(python -c 'import json; print(json.load(open("openrac-mod.json", encoding="utf-8"))["version"])')
          python "$SDK/tools/package_mod.py" --merge dist/bolt-multiplier-"$VERSION"-*.zip -o dist/bolt-multiplier-"$VERSION".zip
          (cd dist && sha256sum *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-release
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish versioned release
    needs: merge
    # Development pushes build artifacts only; only the stable branch publishes.
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-24.04
    concurrency:
      group: bolt-multiplier-releases
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mod-release
          path: dist
      - name: Read version from mod manifest
        id: version
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("openrac-mod.json", encoding="utf-8"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # A manually pushed tag must match the mod's actual version.
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $TAG"
            exit 1
          fi

          test -s "dist/bolt-multiplier-${VERSION}.zip"
          test -s dist/SHA256SUMS

          # Preserve a completed version: subsequent commits with the same
          # version must not silently replace reviewed release binaries.
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')" == "true" ]]; then
              gh release edit "$TAG" --prerelease=false --latest
            fi

            # OpenRAC's external-mod index REQUIRES per-platform ZIP assets.
            # Existing v0.2.4 was published with only the merged ZIP. Repair an
            # incomplete release by uploading ALL files from one successful
            # build (including SHA256SUMS), so their hashes remain consistent.
            ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            REPAIR=0
            for FILE in dist/bolt-multiplier-"$VERSION"-*.zip dist/bolt-multiplier-"$VERSION".zip dist/SHA256SUMS; do
              test -s "$FILE"
              NAME="${FILE##*/}"
              if ! grep -Fqx "$NAME" <<< "$ASSETS"; then
                echo "Missing release asset: $NAME"
                REPAIR=1
              fi
            done
            if [[ "$REPAIR" == 1 ]]; then
              gh release upload "$TAG" --clobber \
                dist/bolt-multiplier-"$VERSION"-*.zip \
                dist/bolt-multiplier-"$VERSION".zip dist/SHA256SUMS
            else
              echo "Release $TAG is complete; leaving its artifacts unchanged."
            fi
            exit 0
          fi

          gh release create "$TAG" \
            --title "Bolt Multiplier $TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --latest \
            dist/bolt-multiplier-"$VERSION"-*.zip \
            dist/bolt-multiplier-"$VERSION".zip dist/SHA256SUMS
